# QUAINT: Postgres + web app + nightly refresh.
#   cp .env.example .env    (set SEC_USER_AGENT; QUAINT_PASSWORD if it's reachable from the internet)
#   docker compose up -d          # the worker's first refresh loads everything (~1 hour):
#   docker compose logs -f worker
# then open http://localhost:8765
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: quaint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quaint}
      POSTGRES_DB: quaint
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quaint"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://quaint:${POSTGRES_PASSWORD:-quaint}@db:5432/quaint
    volumes: [cache:/data]
    ports: ["${QUAINT_PORT:-8765}:8765"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "screener", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://quaint:${POSTGRES_PASSWORD:-quaint}@db:5432/quaint
    volumes: [cache:/data]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  cache:
